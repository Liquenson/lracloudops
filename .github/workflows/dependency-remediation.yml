name: Dependency Remediation (manual)

on:
  workflow_dispatch:
  push:
    branches:
      - security/remediate-audit-p0
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-remediation.yml'

permissions:
  contents: write

concurrency:
  group: dependency-remediation-security-branch
  cancel-in-progress: false

jobs:
  remediate:
    name: Update compatible dependency fixes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/remediate-audit-p0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture current audit
        continue-on-error: true
        run: npm audit --json > audit-before.json

      - name: Apply non-breaking npm audit fixes
        run: npm audit fix

      - name: Commit compatible dependency updates for review
        run: |
          set -euo pipefail
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "security: apply compatible dependency fixes"
            git push origin HEAD:security/remediate-audit-p0
          fi

      - name: Validate lint and types
        run: |
          npm run lint
          npx astro check

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --reporter=list
        env:
          CI: true

      - name: Report remaining vulnerabilities
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=high

