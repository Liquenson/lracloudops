name: Build & Validate
on:
  push:
    branches: [main, v3/clean-slate]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Astro Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx astro check
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
      - name: Check pages
        run: |
          set -euo pipefail
          PAGES=$(find dist -name "*.html" | wc -l)
          test "$PAGES" -gt 0
          echo "$PAGES HTML pages built successfully" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --reporter=list
        env:
          CI: true
