name: Smart Scan — AI security audit

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'GitHub repository URL or owner/repo to scan'
        required: false
        type: string
        default: 'lra-cloud-ops/aws-terraform-devops'
      org:
        description: 'Default GitHub org if repo_url has no "/"'
        required: false
        type: string
        default: 'lra-cloud-ops'
      client_email:
        description: 'Client email to send the report to'
        required: false
        type: string
        default: 'info@lracloudops.com'
      client_name:
        description: 'Client name'
        required: false
        type: string
        default: 'LRA CloudOps Team'
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  smart-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout lra-ai-platform
        uses: actions/checkout@v4
        with:
          repository: lra-cloud-ops/lra-ai-platform
          path: lra-ai-platform
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lra-ai-platform dependencies
        run: pip install -r lra-ai-platform/requirements.txt

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.4
        with:
          version: v0.69.3

      - name: Run Smart Scan
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          INPUT_REPO_URL: ${{ inputs.repo_url }}
          INPUT_ORG: ${{ inputs.org }}
          INPUT_CLIENT_EMAIL: ${{ inputs.client_email }}
          INPUT_CLIENT_NAME: ${{ inputs.client_name }}
        run: |
          python lra-ai-platform/scripts/smart_scan.py \
            --repo "$INPUT_REPO_URL" \
            --org "$INPUT_ORG" \
            --email "$INPUT_CLIENT_EMAIL" \
            --name "$INPUT_CLIENT_NAME"

      - name: Weekly scan — all lra-cloud-ops repos
        if: github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repos=("lra-cloud-ops/lra-ai-platform" "lra-cloud-ops/aws-terraform-devops" "lra-cloud-ops/k8s-on-premise" "lra-cloud-ops/aws-devops-agent")
          failed=0
          for repo in "${repos[@]}"; do
            echo "Scanning $repo..."
            if ! python lra-ai-platform/scripts/smart_scan.py \
              --repo "$repo" \
              --org "lra-cloud-ops" \
              --email "info@lracloudops.com" \
              --name "Weekly Auto-scan"; then
              echo "::error::Scan failed for $repo"
              failed=1
            fi
          done
          exit "$failed"
